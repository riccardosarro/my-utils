# Set prefix to Ctrl+a.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Easy config reload, with C-r.
bind-key r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded."

# Enable mouse support.
set -g mouse on

# Monitor activity to show activity in the status bar.
setw -g monitor-activity on

# Longer history.
set -g history-limit 20000

# Split windows using the | and - keys.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Use Alt-arrow keys to switch panes.
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift arrow to switch windows.
bind -n S-Left previous-window
bind -n S-Right next-window

# Easy resize panes.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# No delay for escape key press.
set -sg escape-time 0

# Enable native Mac OS X copy/paste.
set-option -g default-command "/bin/bash -c 'which reattach-to-user-namespace >/dev/null && exec reattach-to-user-namespace $SHELL -l || exec $SHELL -l'"

##################
# Design changes #
##################

# Automatically rename windows based on the current directory.
set-window-option -g automatic-rename on

# Set window title to the current directory.
set-option -g set-titles on

# Improve colors (optional, requires terminal support).
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:Tc"

# Status bar palette — picks dark/light based on macOS appearance at config load.
# Reload with `<prefix> r` after switching system theme.
if-shell "defaults read -g AppleInterfaceStyle 2>/dev/null | grep -q Dark" {
    set-option -g status-style fg=yellow,bg=black
    set-window-option -g window-status-style fg=cyan,bg=default
    set-window-option -g window-status-current-style fg=brightred,bg=default
    set-window-option -g window-status-activity-style fg=yellow,bg=black,bold
} {
    set-option -g status-style fg=black,bg=white
    set-window-option -g window-status-style fg=blue,bg=default
    set-window-option -g window-status-current-style fg=red,bg=default
    set-window-option -g window-status-activity-style fg=magenta,bg=white,bold
}

# Pane border.
set-option -g pane-border-style fg=black
set-option -g pane-active-border-style fg=brightgreen

# Message text.
if-shell "defaults read -g AppleInterfaceStyle 2>/dev/null | grep -q Dark" {
    set-option -g message-style fg=brightred,bg=black
} {
    set-option -g message-style fg=red,bg=white
}

# Pane number display
set-option -g display-panes-active-colour blue
set-option -g display-panes-colour brightred

# Clock.
set-window-option -g clock-mode-colour green

# Bell.
set-window-option -g window-status-bell-style fg=black,bg=red

# Automatically update SSH_AUTH_SOCK when attaching to existing tmux sessions.
# https://stackoverflow.com/questions/21378569/how-to-auto-update-ssh-agent-environment-variables-when-attaching-to-existing-tm
set-environment -g 'SSH_AUTH_SOCK' $HOME/.ssh/ssh_auth_sock

setw -g mode-keys vi

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind P paste-buffer
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

###########
# Plugins #
###########

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'

run '~/.tmux/plugins/tpm/tpm'
